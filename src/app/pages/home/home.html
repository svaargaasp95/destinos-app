<div class="page">
  <header class="hero">
    <h1>🌎 Wishlist de Destinos</h1>
    <p>Agrega sitios turísticos y vota por tus favoritos</p>
  </header>

  <main class="contenido">
    <section class="seccion-form">
      <h2>Agregar destino</h2>
      <app-destino-form (destinoAgregado)="onDestinoAgregado($event)" />
    </section>

    <section class="seccion-lista">
      <h2>Destinos guardados</h2>
      <app-destino-list />
    </section>
  </main>
</div>
